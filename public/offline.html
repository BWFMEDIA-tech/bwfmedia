    main { max-width:400px; text-align:center; } img { width:96px; height:96px; } h1 { font-size:28px; } p { color:var(--muted); } a { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:8px 24px; border-radius:4px; background:var(--primary); color:var(--background); text-decoration:none; font-weight:600; }
  </style>
</head>
<body><main><img src="/icon-192.png" alt="Tunevio"><h1>You’re offline</h1><p>Reconnect to listen to music, join live battles, view your account or finish an upload or payment.</p><a href="/">Try again</a></main></body>
